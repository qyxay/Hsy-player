        // ===================== 自动连播功能 =====================
        // 初始化自动连播
        function initAutoPlayNext() {
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.addEventListener('ended', function() {
                const currentAudio = document.getElementById('audioName').value;
                const currentIndex = allEpisodes.findIndex(ep => ep.name === currentAudio);
                
                if (currentIndex >= 0 && currentIndex < allEpisodes.length - 1) {

                    // 填充并播放下一集
                    document.getElementById('audioName').value = nextAudio;
                    
                    // 高亮并滚动到下一集
                    document.querySelectorAll('.episode-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.textContent === nextAudio) {
                            item.classList.add('active');
                            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    });
                    
                    loadAudio();
                }
            });
        }

        // 初始化剧集列表
        function initEpisodeList() {
            const episodes = FULL_EPISODE_LIST.split('\n').filter(line => line.trim() && line.endsWith('.m4a'));
            
            // 按篇章分组 - 取消"其它"分类
            const chapterMap = {};
            const episodeRegex = /^(.*?篇) 第(\d+)集/;
            
            episodes.forEach(ep => {
                const match = ep.match(episodeRegex);
                if (!match) return; // 跳过不匹配的，取消"其它"分类
                
                const chapter = match[1];
                const episodeNum = parseInt(match[2]);
                
                if (!chapterMap[chapter]) {
                    chapterMap[chapter] = [];
                }
                const epObj = { name: ep, num: episodeNum };
                chapterMap[chapter].push(epObj);
            });
            
            // 填充allEpisodes数组（用于连播）- 按篇章+集数排序
            allEpisodes = [];
            const chapterOrder = ['阴阳行者篇', '不灭神明篇', '四海八荒篇', '暗流涌动篇', '无尽规则篇', '诸神黄昏篇'];
            chapterOrder.forEach(chapter => {
                if (chapterMap[chapter]) {
                    chapterMap[chapter].sort((a, b) => a.num - b.num);
                    allEpisodes = allEpisodes.concat(chapterMap[chapter]);
                }
            });

            // 渲染
            const listContainer = document.getElementById('episodeList');
            Object.keys(chapterMap).forEach(chapter => {
                // 篇章标题
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter-title';
                chapterDiv.innerHTML = `${chapter} <span>▼</span>`;
                chapterDiv.onclick = function() {
                    this.nextElementSibling.classList.toggle('show');
                    const arrow = this.querySelector('span');
                    arrow.textContent = this.nextElementSibling.classList.contains('show') ? '▲' : '▼';
                };
                listContainer.appendChild(chapterDiv);

                // 剧集列表
                const epsDiv = document.createElement('div');
                epsDiv.className = 'chapter-episodes';
                
                // 按集数排序
                chapterMap[chapter].sort((a, b) => a.num - b.num);
                chapterMap[chapter].forEach(ep => {
                    const epItem = document.createElement('div');
                    epItem.className = 'episode-item';
                    epItem.textContent = ep.name;
                    epItem.onclick = function() {
                        document.querySelectorAll('.episode-item').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                        document.getElementById('audioName').value = ep.name;
                    };
                    epsDiv.appendChild(epItem);
                });
                listContainer.appendChild(epsDiv);
            });
        }

        // ===================== 注册功能 =====================
        async function handleRegister() {
            const account = document.getElementById('regAccount').value.trim();
            const key = document.getElementById('regKey').value;
            const keyConfirm = document.getElementById('regKeyConfirm').value;
            const tip = document.getElementById('registerTip');

            // 前端校验
            if (!account) {
                tip.className = 'tip tip-error';
                tip.textContent = '请输入账号名';
                return;
            }
            if (!key || key.length < 4) {
                tip.className = 'tip tip-error';
                tip.textContent = '密钥至少4位';
                return;
            }
            if (key !== keyConfirm) {
                tip.className = 'tip tip-error';
                tip.textContent = '两次输入的密钥不一致';
                return;
            }
            if (allUserList.find(u => u.account === account)) {
                tip.className = 'tip tip-error';
                tip.textContent = '该账号已存在';
                return;
            }

            // 检查令牌
            if (!GITHUB_CONFIG.token) {
                tip.className = 'tip tip-error';
                tip.textContent = '请先在代码中填入GitHub令牌，再进行注册';
                return;
            }

            tip.className = 'tip tip-info';
            tip.textContent = '正在同步账号到GitHub仓库，请稍候...';

            try {
                // 1. 获取仓库中account.json的当前sha（用于更新）
                const getFileUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}?ref=${GITHUB_CONFIG.branch}`;
                const getResponse = await fetch(getFileUrl, {
                    headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` }
                });
                
                if (!getResponse.ok) {
                    throw new Error('获取仓库文件失败，请检查令牌权限');
                }
                
                const fileData = await getResponse.json();
                const currentContent = JSON.parse(atob(fileData.content));
                
                // 2. 添加新账号
                currentContent.push({ account, key });
                
                // 3. 提交更新到仓库
                const updateUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
                const updateResponse = await fetch(updateUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `新增账号: ${account}`,
                        content: btoa(JSON.stringify(currentContent, null, 4)),
                        sha: fileData.sha,
                        branch: GITHUB_CONFIG.branch
                    })
                });

                if (!updateResponse.ok) {
                    throw new Error('提交到仓库失败，请检查令牌权限');
                }

                // 4. 更新本地用户列表
                allUserList = currentContent;

                tip.className = 'tip tip-success';
                tip.textContent = '注册成功！账号已同步到仓库，可切换到登录页使用';
                
                // 清空表单
                document.getElementById('regAccount').value = '';
                document.getElementById('regKey').value = '';
                document.getElementById('regKeyConfirm').value = '';

            } catch (error) {
                tip.className = 'tip tip-error';
                tip.textContent = `注册失败: ${error.message}`;
            }
        }
